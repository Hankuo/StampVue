name: Deploy StampVue to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安裝前端相依套件 (Install dependencies)
        run: |
          cd frontend
          npm ci || npm install

      - name: 🏗️ 建置生產環境前端 (Build Vite production bundle)
        run: |
          cd frontend
          npm run build

      - name: 🌐 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 上傳靜態檔案構件 (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: 🚀 部署至 GitHub Pages (Deploy to GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
