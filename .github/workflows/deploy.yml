name: Deploy StampVue to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 🌐 配置 GitHub Pages 環境
        uses: actions/configure-pages@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 安裝相依套件 (Install dependencies)
        run: cd frontend && npm install

      - name: 🏗️ 建置生產環境前端 (Build Vite production bundle)
        run: cd frontend && npm run build

      - name: 📤 上傳靜態構件至 GitHub Pages (Upload Pages Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 部署至 GitHub Pages (Deploy to GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
